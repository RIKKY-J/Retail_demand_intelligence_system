# Central Inventory & Forecasting Configuration
# Thresholds and defaults defined per Section 8 of the implementation plan.

project:
  name: "AI-Powered Retail Inventory Management & Demand Prediction System"
  default_store_id: "CA_1"
  unmet_demand_mode: "lost_sales" # Retail shelf assumption: lost sales, not backordered

storage:
  database_path: "data/retail_inventory.db"
  processed_sales_path: "data/processed/sample_sales.parquet"
  real_m5_sales_path: "data/processed/m5_sales.parquet"
  mock_forecasts_path: "data/mock/forecast_results.csv"
  models_dir: "models"

forecasting:
  horizons: [7, 14, 28]
  baseline_model_version: "seasonal_naive_v1"
  ml_model_version: "lgbm_tweedie_v1"
  tweedie_variance_power: 1.2
  backtest_holdout_days: 28

inventory:
  service_level: 0.95
  service_level_z: 1.645 # 95% cycle service level Z-score
  default_lead_time_days: 5
  default_review_period_days: 7
  default_unit_cost: 4.50
  default_moq: 1
  default_pack_size: 1

financial:
  annual_holding_rate: 0.25 # 25% annual carrying cost -> daily rate = 0.25 / 365
  stockout_penalty_multiplier: 0.35 # Margin loss multiplier per unit of lost sales * unit_cost

thresholds:
  # IP <= ROP -> Reorder required
  reorder_point_inclusive: true
  # On-hand > overstock_multiplier * Target Stock -> Possible overstock
  overstock_multiplier: 1.5
